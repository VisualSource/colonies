# Colonies settings. Restart the server after changing them.

# Chunk claims: a colony's border. The numbers are MineColonies' defaults.
claims:
  # Chunks claimed in every direction from the town hall's chunk when a colony is founded.
  initial-size: 4
  # A new town hall must be at least this many chunks (x16 blocks) from another colony's town hall.
  min-distance: 8
  # No claim reaches farther than this many chunks from the town hall's chunk.
  max-size: 20

# Keeping colonies loaded. The numbers are MineColonies' defaults.
chunk-loading:
  # While a colony's owner or an officer is on its land, its loaded chunks stay loaded, and for a while after they leave.
  enabled: true
  # How long after they leave, in minutes (1 to 1440). With no owner or officer online it runs out three times as fast.
  minutes: 20
  # 1 to 15: only chunks at least this many of the colony's huts claim (1: every chunk a hut claims; higher: fewer, the inner ones).
  strictness: 3

protection:
  # Inside a colony's border, other players can only do what their rank there allows.
  enabled: true
  # What explosions may damage inside a colony's border. Hut blocks and graves are never damaged.
  #   everything - vanilla: blocks, mobs and players
  #   entities   - mobs and players, but not blocks (MineColonies' default)
  #   players    - only players and hostile mobs
  #   nothing    - only players
  explosions: everything

# Raids: hordes of hostile mobs attack colonies at night. The numbers are MineColonies' defaults.
raids:
  enabled: true
  # 0 to 10: how many raiders come (5 is normal).
  difficulty: 5
  # The most raiders in one raid (6 to 400).
  max-raiders: 80
  # Nights between raids: at least the minimum, on average the average.
  average-nights: 14
  minimum-nights: 10
  # Zombie raiders break doors (on Normal and Hard).
  break-doors: true

# Commands MineColonies' server config can open to players who aren't admins (minecp.admin); its defaults.
commands:
  # /colonies colony info, for a colony's owner and officers.
  colony-info: true
  # /colonies colony addOfficer, for a colony's owner and officers.
  add-officer: true
  # /colonies citizens kill, for a colony's owner and officers.
  kill-citizens: false
  # /colonies citizens modify, for a colony's owner and officers in creative mode.
  modify-citizens: false

research:
  # Research a creative player starts is finished at once (as the mod's default).
  creative-completion: true
  # What undoing a finished research costs: ancient_tome (the mod's, dropped by raiders) or any vanilla item.
  reset-cost:
    item: ancient_tome
    amount: 1

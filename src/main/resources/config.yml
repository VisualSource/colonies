# MineCP settings. Restart the server after changing them.

# Chunk claims: a colony's border. The numbers are MineColonies' defaults.
claims:
  # Chunks claimed in every direction from the town hall's chunk when a colony is founded.
  initial-size: 4
  # A new town hall must be at least this many chunks (x16 blocks) from another colony's town hall.
  min-distance: 8
  # No claim reaches farther than this many chunks from the town hall's chunk.
  max-size: 20

protection:
  # Inside a colony's border, other players can only do what their rank there allows.
  enabled: true
  # What explosions may damage inside a colony's border. Hut blocks and graves are never damaged.
  #   everything - vanilla: blocks, mobs and players
  #   entities   - mobs and players, but not blocks (MineColonies' default)
  #   players    - only players and hostile mobs
  #   nothing    - only players
  explosions: everything

# Raids: hordes of hostile mobs attack colonies at night. The numbers are MineColonies' defaults.
raids:
  enabled: true
  # 0 to 10: how many raiders come (5 is normal).
  difficulty: 5
  # The most raiders in one raid (6 to 400).
  max-raiders: 80
  # Nights between raids: at least the minimum, on average the average.
  average-nights: 14
  minimum-nights: 10
  # Zombie raiders break doors (on Normal and Hard).
  break-doors: true
